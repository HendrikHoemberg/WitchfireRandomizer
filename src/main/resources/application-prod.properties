# Production profile overrides (activated via SPRING_PROFILES_ACTIVE=prod)

# Network binding: listen only on localhost behind Caddy reverse proxy
server.address=127.0.0.1
server.port=9090

# Reverse proxy configuration: honor X-Forwarded-* headers from Caddy
server.forward-headers-strategy=framework

# Security & Error hygiene: suppress stack traces and framework internals
server.error.include-stacktrace=never
server.error.whitelabel.enabled=false

# Performance: enable Thymeleaf template caching in production
spring.thymeleaf.cache=true

# Logging: rolling file retention under configured LOG_PATH (defaults to logs or set via env)
logging.file.name=${LOG_PATH:logs}/witchfire.log
logging.logback.rollingpolicy.file-name-pattern=${LOG_PATH:logs}/witchfire-%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=100MB
logging.level.dev.hendrikhoemberg.witchfirerandomizer=INFO
logging.level.org.springframework.web=WARN
