# Production profile overrides (activated via SPRING_PROFILES_ACTIVE=prod)

# Network binding: listen only on localhost behind Caddy reverse proxy
server.address=127.0.0.1
server.port=9090

# Reverse proxy configuration: honor X-Forwarded-* headers from Caddy
server.forward-headers-strategy=framework

# Security & Error hygiene: suppress stack traces and framework internals
server.error.include-stacktrace=never
server.error.whitelabel.enabled=false

# Performance: enable Thymeleaf template caching in production
spring.thymeleaf.cache=true
