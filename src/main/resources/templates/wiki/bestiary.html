<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestiary - Witchfire Companion</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/main.css">
    <script src="/js/htmx.min.js"></script>
    <script defer src="/js/alpine.min.js"></script>
</head>
<body>
    <div th:replace="~{fragments/navigation :: navbar('bestiary')}"></div>

    <main class="container" x-data="{
        searchQuery: '',
        selectedLocation: '',
        sortCriteria: 'name',
        updateFilters() {
            htmx.ajax('GET', '/wiki/bestiary/enemies', {
                target: '#bestiary-enemies-grid',
                swap: 'outerHTML',
                values: {
                    search: this.searchQuery,
                    location: this.selectedLocation,
                    sort: this.sortCriteria
                }
            });
        },
        clearAllFilters() {
            this.searchQuery = '';
            this.selectedLocation = '';
            this.sortCriteria = 'name';
            this.updateFilters();
        }
    }">
        <!-- Centered Witchfire Logo -->
        <div class="logo-container">
            <a href="/">
                <img src="/images/wf-logo2.webp" alt="Witchfire" class="page-logo">
            </a>
        </div>

        <!-- Wiki Sub-Navigation Tabs -->
        <div th:replace="~{wiki/fragments/wiki-nav :: wikiNav('bestiary')}"></div>

        <!-- Search and Filters Box -->
        <div class="wiki-filter-box texture-box">
            <!-- Search Input -->
            <div class="search-input-wrapper">
                <input type="text"
                       class="wiki-search-input"
                       placeholder="Search enemies by name, location, or attack..."
                       x-model="searchQuery"
                       @input.debounce.300ms="updateFilters()" />
                <button type="button"
                        x-show="searchQuery.length > 0"
                        @click="searchQuery = ''; updateFilters()"
                        class="search-clear-btn"
                        title="Clear search">
                    &times;
                </button>
            </div>

            <!-- Filters: location is the primary axis now, sort sits beside it -->
            <div class="filter-secondary-row">
                <div class="filter-secondary-field">
                    <label class="filter-secondary-label" for="location-select">Location:</label>
                    <select id="location-select"
                            class="wiki-select"
                            x-model="selectedLocation"
                            @change="updateFilters()">
                        <option value="">All Locations</option>
                        <optgroup th:each="group : ${locationGroups}" th:label="${group.key}">
                            <option th:each="option : ${group.value}"
                                    th:value="${option.value}"
                                    th:text="${option.label}">Irongate Castle</option>
                        </optgroup>
                    </select>
                </div>

                <div class="filter-secondary-field">
                    <label class="filter-secondary-label" for="sort-select">Sort:</label>
                    <select id="sort-select"
                            class="wiki-select"
                            x-model="sortCriteria"
                            @change="updateFilters()">
                        <option value="name">Name (A-Z)</option>
                        <option value="health">Health (High to Low)</option>
                    </select>
                </div>

                <div x-show="searchQuery || selectedLocation || sortCriteria !== 'name'">
                    <button type="button"
                            class="filter-pill-btn filter-reset-btn"
                            @click="clearAllFilters()">
                        Reset Filters
                    </button>
                </div>
            </div>
        </div>

        <!-- Enemy Grid -->
        <div th:replace="~{wiki/fragments/enemy-grid :: enemyGrid}"></div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
