<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestiary - Witchfire Companion</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/main.css">
    <script src="/js/htmx.min.js"></script>
    <script defer src="/js/alpine.min.js"></script>
</head>
<body>
    <div th:replace="~{fragments/navigation :: navbar('bestiary')}"></div>

    <main class="container" x-data="{
        searchQuery: '',
        selectedGnosis: '',
        selectedLocation: '',
        sortCriteria: 'name',
        updateFilters() {
            htmx.ajax('GET', '/wiki/bestiary/enemies', {
                target: '#bestiary-enemies-grid',
                swap: 'outerHTML',
                values: {
                    search: this.searchQuery,
                    gnosis: this.selectedGnosis,
                    location: this.selectedLocation,
                    sort: this.sortCriteria
                }
            });
        },
        clearAllFilters() {
            this.searchQuery = '';
            this.selectedGnosis = '';
            this.selectedLocation = '';
            this.sortCriteria = 'name';
            this.updateFilters();
        }
    }">
        <!-- Centered Witchfire Logo -->
        <div class="logo-container">
            <a href="/">
                <img src="/images/wf-logo2.webP" alt="Witchfire" class="page-logo">
            </a>
        </div>

        <!-- Wiki Sub-Navigation Tabs -->
        <div th:replace="~{wiki/fragments/wiki-nav :: wikiNav('bestiary')}"></div>

        <!-- Search and Filters Box -->
        <div class="wiki-filter-box texture-box">
            <!-- Search Input -->
            <div class="search-input-wrapper">
                <input type="text"
                       class="wiki-search-input"
                       placeholder="Search enemies by name, attack, or location..."
                       x-model="searchQuery"
                       @input.debounce.300ms="updateFilters()" />
                <button type="button"
                        x-show="searchQuery.length > 0"
                        @click="searchQuery = ''; updateFilters()"
                        class="search-clear-btn"
                        title="Clear search">
                    &times;
                </button>
            </div>

            <!-- Gnosis Level Filter -->
            <div style="margin-bottom: 0.5rem;">
                <h3 class="filter-section-title">Filter by Gnosis</h3>
                <div class="filter-pills-row">
                    <button type="button"
                            class="filter-pill-btn"
                            :class="selectedGnosis === '' ? 'active' : ''"
                            @click="selectedGnosis = ''; updateFilters()">
                        All Gnosis
                    </button>
                    <button th:each="g : ${gnosisLevels}"
                            type="button"
                            class="filter-pill-btn"
                            th:data-gnosis="${g}"
                            th:text="'Gnosis ' + ${g}"
                            :class="selectedGnosis === $el.dataset.gnosis ? 'active' : ''"
                            @click="selectedGnosis = $el.dataset.gnosis; updateFilters()">
                        Gnosis 0
                    </button>
                </div>
            </div>

            <!-- Secondary Filters: Location & Reset -->
            <div style="display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 1.25rem; padding-top: 1.25rem; border-top: 1px solid var(--wf-border); align-items: center; justify-content: space-between;">
                <!-- Location Filter -->
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <label style="font-size: 0.85rem; color: #9ca3af; font-weight: 500;">Location:</label>
                    <select class="custom-select"
                            style="background: #201d19; color: #e5e7eb; border: 1px solid var(--wf-border); border-radius: 0.375rem; padding: 0.35rem 0.75rem; font-size: 0.85rem;"
                            x-model="selectedLocation"
                            @change="updateFilters()">
                        <option value="">All Locations</option>
                        <option th:each="loc : ${locations}" th:value="${loc}" th:text="${loc}">Location</option>
                    </select>
                </div>

                <!-- Reset Filters Button -->
                <div x-show="searchQuery || selectedGnosis !== '' || selectedLocation || sortCriteria !== 'name'">
                    <button type="button"
                            class="filter-pill-btn filter-reset-btn"
                            @click="clearAllFilters()">
                        Reset Filters
                    </button>
                </div>
            </div>
        </div>

        <!-- Results Header -->
        <div class="wiki-results-header">
            <div class="results-counter">
                Showing <span th:text="${#lists.size(enemies)}">0</span>
                <span th:text="${#lists.size(enemies) == 1 ? 'enemy' : 'enemies'}">enemies</span>
            </div>

            <!-- Sort dropdown aligned right, matching Equipment tab -->
            <div style="display: flex; align-items: center; gap: 0.5rem;">
                <label style="font-size: 0.9rem; color: #ffffff; font-weight: 500;">Sort By:</label>
                <select class="wiki-sort-select"
                        x-model="sortCriteria"
                        @change="updateFilters()">
                    <option value="name">Name (A-Z)</option>
                    <option value="health">Health (High to Low)</option>
                    <option value="gnosis">Gnosis (Low to High)</option>
                </select>
            </div>
        </div>

        <!-- Enemy Grid -->
        <div th:replace="~{wiki/fragments/enemy-grid :: enemyGrid}"></div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
