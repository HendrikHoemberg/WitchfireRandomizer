<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcana - Witchfire Companion</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/main.css">
    <script src="/js/htmx.min.js"></script>
    <script defer src="/js/alpine.min.js"></script>
</head>
<body>
    <div th:replace="~{fragments/navigation :: navbar('arcana')}"></div>

    <main class="container" x-data="{
        searchQuery: '',
        selectedElement: '',
        selectedProphecyType: '',
        updateFilters() {
            htmx.ajax('GET', '/wiki/arcana/cards', {
                target: '#arcana-cards-grid',
                swap: 'outerHTML',
                values: {
                    search: this.searchQuery,
                    element: this.selectedElement,
                    prophecyType: this.selectedProphecyType
                }
            });
        },
        clearAllFilters() {
            this.searchQuery = '';
            this.selectedElement = '';
            this.selectedProphecyType = '';
            this.updateFilters();
        }
    }">
        <!-- Centered Witchfire Logo -->
        <div class="logo-container">
            <a href="/">
                <img src="/images/wf-logo2.webP" alt="Witchfire" class="page-logo">
            </a>
        </div>

        <!-- Wiki Sub-Navigation Tabs -->
        <div th:replace="~{wiki/fragments/wiki-nav :: wikiNav('arcana')}"></div>

        <!-- Filter Box -->
        <div class="wiki-filter-box texture-box">
            <div class="search-input-wrapper">
                <input type="text"
                       class="wiki-search-input"
                       placeholder="Search Arcana by name, description, or effects..."
                       x-model="searchQuery"
                       @input.debounce.300ms="updateFilters()" />
                <button type="button"
                        x-show="searchQuery.length > 0"
                        @click="searchQuery = ''; updateFilters()"
                        class="search-clear-btn"
                        title="Clear search">
                    &times;
                </button>
            </div>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem;">
                <!-- Element Filter -->
                <div>
                    <h3 class="filter-section-title">Filter by Element</h3>
                    <div class="filter-pills-row">
                        <button type="button"
                                class="filter-pill-btn"
                                :class="selectedElement === '' ? 'active' : ''"
                                @click="selectedElement = ''; updateFilters()">
                            All Elements
                        </button>
                        <button th:each="elem : ${elements}"
                                type="button"
                                class="filter-pill-btn"
                                th:data-elem="${elem.name()}"
                                th:text="${elem.name()}"
                                :class="selectedElement === $el.dataset.elem ? 'active' : ''"
                                @click="selectedElement = $el.dataset.elem; updateFilters()">
                            Element
                        </button>
                    </div>
                </div>

                <!-- Prophecy Type Filter -->
                <div>
                    <h3 class="filter-section-title">Filter by Category / Prophecy</h3>
                    <div style="margin-top: 0.25rem;">
                        <select class="custom-select"
                                style="background: #201d19; color: #e5e7eb; border: 1px solid var(--wf-border); border-radius: 0.375rem; padding: 0.45rem 0.85rem; font-size: 0.85rem; width: 100%; max-width: 320px;"
                                x-model="selectedProphecyType"
                                @change="updateFilters()">
                            <option value="">All Categories</option>
                            <option th:each="ptype : ${prophecyTypes}"
                                    th:value="${ptype}"
                                    th:text="${ptype}">Type</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Reset Filters Button -->
            <div style="display: flex; justify-content: flex-end; margin-top: 1rem;"
                 x-show="searchQuery || selectedElement || selectedProphecyType">
                <button type="button"
                        class="filter-pill-btn filter-reset-btn"
                        @click="clearAllFilters()">
                    Reset Filters
                </button>
            </div>
        </div>

        <!-- Results Header -->
        <div class="wiki-results-header">
            <div class="results-counter">
                Showing <span th:text="${#lists.size(cards)}">121</span> Arcana cards
            </div>
        </div>

        <!-- Cards View -->
        <div th:replace="~{wiki/fragments/arcana-grid :: arcanaGrid}"></div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
