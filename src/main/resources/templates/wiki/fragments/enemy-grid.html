<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="enemyGrid" id="bestiary-enemies-grid" class="bestiary-grid">
    <div th:if="${#lists.isEmpty(enemies)}" class="empty-state texture-box" style="grid-column: 1 / -1; padding: 3rem; text-align: center;">
        <h3 style="color: var(--wf-gold); font-size: 1.25rem; margin-bottom: 0.5rem;">No Enemies Found</h3>
        <p style="color: #9ca3af; font-size: 0.95rem;">Try adjusting your search criteria or Gnosis level.</p>
    </div>

    <div th:each="enemy : ${enemies}"
         class="enemy-card texture-box is-clickable"
         th:id="${enemy.id}"
         @click="openEnemyModal($el.getAttribute('data-enemy-id'))"
         th:data-enemy-id="${enemy.id}"
         >
        <div class="enemy-card-header">
            <div class="enemy-portrait-box">
                <img th:src="${enemy.iconUrl}" th:alt="${enemy.name}" loading="lazy" />
            </div>
            <div style="flex-grow: 1; min-width: 0;">
                <div style="display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; margin-bottom: 0.25rem;">
                    <h3 class="enemy-card-title" th:text="${enemy.name}">Enemy Name</h3>
                    <span th:if="${enemy.gnosis != null}"
                          class="gnosis-badge"
                          th:text="'Gnosis ' + ${enemy.gnosis}">Gnosis 0</span>
                </div>
                <div style="display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;">
                    <span class="rank-badge" th:text="${enemy.rank}">Rank</span>
                    <span th:if="${enemy.health != null and enemy.health > 0}"
                          class="health-chip"
                          th:text="'HP: ' + ${#numbers.formatInteger(enemy.health, 1, 'COMMA')}">HP: 1,200</span>
                </div>
            </div>
        </div>

        <div class="enemy-card-body">
            <p class="enemy-desc" th:text="${enemy.description != null and !enemy.description.isBlank() ? enemy.description : 'A denizen of the Witch domain.'}">Enemy description</p>

            <!-- Locations summary (Clean single-line indicator; full territory details in modal) -->
            <div th:if="${enemy.locations != null and !enemy.locations.isEmpty()}" style="margin-top: 0.5rem; font-size: 0.75rem; color: #9ca3af;">
                <span th:text="${#lists.size(enemy.locations) == 1 ? enemy.locations[0] : enemy.locations[0] + ' (+' + (#lists.size(enemy.locations) - 1) + ')'}">Location</span>
            </div>
        </div>
    </div>
</div>
</body>
</html>
