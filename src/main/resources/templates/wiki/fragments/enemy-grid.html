<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="enemyGrid" id="bestiary-enemies-grid">
    <div class="wiki-results-header">
        <div class="results-counter">
            Showing <span th:text="${#lists.size(enemies)}">0</span>
            <span th:text="${#lists.size(enemies) == 1 ? 'enemy' : 'enemies'}">enemies</span>
        </div>
    </div>

    <div class="bestiary-grid">
    <div th:if="${#lists.isEmpty(enemies)}" class="empty-state texture-box" style="grid-column: 1 / -1; padding: 3rem; text-align: center;">
        <h3 style="color: var(--wf-gold); font-size: 1.25rem; margin-bottom: 0.5rem;">No Enemies Found</h3>
        <p style="color: #9ca3af; font-size: 0.95rem;">Try adjusting your search or location filter.</p>
    </div>

    <article th:each="enemy : ${enemies}"
             class="enemy-card texture-box"
             th:id="${enemy.id}">
        <!-- Full-body render in its own plate: the art is the richest content on the card. -->
        <div class="enemy-card-portrait">
            <img th:if="${enemy.iconUrl != null}"
                 th:src="${enemy.iconUrl}"
                 th:alt="${enemy.name}"
                 loading="lazy"
                 decoding="async" />
        </div>

        <div class="enemy-card-dossier">
            <!-- Header: name with the rank badge in the card's top-right slot -->
            <header class="enemy-card-header">
                <div class="enemy-card-heading">
                    <div class="enemy-card-title-row">
                        <h3 class="enemy-card-title" th:text="${enemy.name}">Enemy Name</h3>
                        <span th:if="${enemy.rank != null and !enemy.rank.isBlank() and !enemy.rank.equalsIgnoreCase(enemy.name)}"
                              class="enemy-rank-tag"
                              th:text="${enemy.rank}">Rank</span>
                    </div>
                </div>
            </header>

            <!-- Combat stats -->
            <div class="enemy-stat-grid">
                <div class="enemy-stat">
                    <span class="enemy-stat-label">Health</span>
                    <span class="enemy-stat-value"
                          th:text="${enemy.health != null and enemy.health > 0 ? #numbers.formatInteger(enemy.health, 1, 'COMMA') : '—'}">2,600</span>
                </div>
                <div class="enemy-stat">
                    <span class="enemy-stat-label">Attack</span>
                    <span class="enemy-stat-value"
                          th:text="${enemy.damage != null and !enemy.damage.isBlank() ? enemy.damage : '—'}">4 - 35</span>
                </div>
            </div>

            <!-- Alternate forms: the upgraded variants this enemy also appears as -->
            <div th:if="${!enemy.variantForms.isEmpty()}" class="enemy-forms-row">
                <span class="enemy-forms-label">Forms</span>
                <div class="enemy-forms-chips">
                    <span th:each="form : ${enemy.variantForms}" class="enemy-form-chip" th:text="${form}">Elite</span>
                </div>
            </div>

            <!-- Affinity ledger: weaknesses first, then resistances. Bar length and intensity
                 both encode magnitude, so +100% reads heavier than +5%. -->
            <div class="enemy-affinity-ledger"
                 th:with="vulnerabilities=${enemy.vulnerabilities}, resistances=${enemy.resistances}">
                <th:block th:if="${!vulnerabilities.isEmpty()}">
                    <span class="enemy-affinity-label is-vulnerable">Vulnerable</span>
                    <div class="enemy-affinity-entries">
                        <div th:each="affinity : ${vulnerabilities}" class="enemy-affinity-entry is-vulnerable">
                            <span class="enemy-affinity-name">
                                <span class="enemy-affinity-dot" th:style="'background:' + ${affinity.color}"></span>
                                <span th:text="${affinity.name}">Decay</span>
                            </span>
                            <span class="enemy-affinity-track">
                                <span class="enemy-affinity-fill is-vulnerable"
                                      th:style="'width:' + ${affinity.strength()} + '%;opacity:' + ${affinity.intensityPercent()} + '%'"></span>
                            </span>
                            <span class="enemy-affinity-value" th:text="${affinity.displayValue()}">-100%</span>
                        </div>
                    </div>
                </th:block>

                <th:block th:if="${!resistances.isEmpty()}">
                    <span class="enemy-affinity-label">Resists</span>
                    <div class="enemy-affinity-entries">
                        <div th:each="affinity : ${resistances}" class="enemy-affinity-entry">
                            <span class="enemy-affinity-name">
                                <span class="enemy-affinity-dot" th:style="'background:' + ${affinity.color}"></span>
                                <span th:text="${affinity.name}">Fire</span>
                            </span>
                            <span class="enemy-affinity-track">
                                <span class="enemy-affinity-fill"
                                      th:style="'width:' + ${affinity.strength()} + '%;opacity:' + ${affinity.intensityPercent()} + '%'"></span>
                            </span>
                            <span class="enemy-affinity-value" th:text="${affinity.displayValue()}">+75%</span>
                        </div>
                    </div>
                </th:block>

                <p th:if="${vulnerabilities.isEmpty() and resistances.isEmpty()}" class="enemy-affinity-none">
                    No elemental resistances or weaknesses.
                </p>
            </div>

            <!-- Territory: every location is in the DOM; the overflow ones expand in place. -->
            <div th:if="${enemy.locations != null and !enemy.locations.isEmpty()}"
                 class="enemy-locations-row"
                 x-data="{ expanded: false }"
                 th:with="hiddenCount=${enemy.locations.size() - 3}">
                <span class="enemy-locations-label">Territory</span>
                <div class="locations-chips-row">
                    <span th:each="loc, iter : ${enemy.locations}"
                          class="location-chip"
                          th:attr="x-show=${iter.index >= 3} ? 'expanded' : null"
                          th:text="${loc}">Irongate Castle</span>
                    <button th:if="${hiddenCount > 0}"
                            type="button"
                            class="location-chip location-chip-more"
                            th:data-more="|+${hiddenCount} more|"
                            th:text="|+${hiddenCount} more|"
                            @click="expanded = !expanded"
                            x-text="expanded ? 'Show fewer' : $el.dataset.more">+1 more</button>
                </div>
            </div>
        </div>
    </article>
    </div>
</div>
</body>
</html>
