<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="arcanaModalContent" th:if="${card != null}" class="wiki-modal-container">
    <!-- Header with card art / icon and metadata -->
    <div class="wiki-modal-header">
        <div class="arcana-modal-icon-frame">
            <img th:if="${card.iconUrl != null}" th:src="${card.iconUrl}" th:alt="${card.name}" />
            <span th:if="${card.iconUrl == null}" class="arcana-modal-icon-fallback" th:text="${#strings.substring(card.name, 0, 1)}">A</span>
        </div>
        <div class="wiki-modal-header-info">
            <div class="wiki-modal-title-row">
                <h2 class="wiki-modal-title" th:text="${card.name}">Card Name</h2>
                <span th:if="${card.element != null}" class="element-pill">
                    <span class="element-dot" th:style="'background-color: ' + ${card.element.color}"></span>
                    <span th:style="'color: ' + ${card.element.color}" th:text="${card.element.name()}">Fire</span>
                </span>
            </div>
            <div class="arcana-category-pills" th:if="${card.prophecyTypes != null and !card.prophecyTypes.isEmpty()}">
                <span th:each="ptype : ${card.prophecyTypes}"
                      th:if="${card.element == null or (!ptype.equalsIgnoreCase(card.element.name()) and !ptype.equalsIgnoreCase(card.element.name() + ' Element'))}"
                      class="arcana-tag"
                      th:text="${ptype}">Fire Element</span>
            </div>
            <div th:if="${card.element == null and (card.prophecyTypes == null or card.prophecyTypes.isEmpty())}" style="font-size: 0.8rem; color: #9ca3af; font-style: italic; margin-top: 0.25rem;">
                Neutral Arcana
            </div>
        </div>
    </div>

    <!-- Description / Lore Section -->
    <div class="wiki-modal-section">
        <h4 class="wiki-modal-section-title">Card Description</h4>
        <div class="wiki-note-box">
            <p class="arcana-lore-text" th:text="${card.description}">Burning enemies receive even more damage.</p>
        </div>
    </div>

    <!-- Manifestation Scaling Section -->
    <div th:if="${card.effects != null and !card.effects.isBlank()}" class="wiki-modal-section">
        <h4 class="wiki-modal-section-title">Manifestation Scaling</h4>
        <div class="wiki-note-box">
            <div class="arcana-scaling-effect" th:text="${card.effects}">
                Damage to burning enemies: +15% / +25%
            </div>
        </div>
    </div>
</div>
</body>
</html>
