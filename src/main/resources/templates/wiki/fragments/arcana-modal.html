<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="arcanaModalContent" class="modal-body-content">
    <div style="display: flex; gap: 1.5rem; align-items: flex-start; margin-bottom: 1.5rem; padding-bottom: 1.25rem; border-bottom: 1px solid var(--wf-border);">
        <div style="width: 5rem; height: 5rem; background: #0c0b09; border: 1px solid var(--wf-border); border-radius: 0.5rem; padding: 0.5rem; flex-shrink: 0; display: flex; align-items: center; justify-content: center;">
            <img th:src="${card.iconUrl}" th:alt="${card.name}" style="width: 100%; height: 100%; object-fit: contain;" />
        </div>
        <div style="flex-grow: 1;">
            <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem;">
                <h2 style="font-size: 1.5rem; color: var(--wf-gold); font-family: var(--font-gothic, serif); font-weight: 700; margin: 0;" th:text="${card.name}">Card Name</h2>
                <span th:if="${card.element != null}"
                      class="element-badge"
                      th:style="'border-color: ' + ${card.element.color} + '; color: ' + ${card.element.color} + ';'"
                      th:text="${card.element.name()}">Fire</span>
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 0.35rem;">
                <span th:each="ptype : ${card.prophecyTypes}"
                      class="arcana-tag"
                      th:text="${ptype}">Type</span>
            </div>
        </div>
    </div>

    <div style="margin-bottom: 1.25rem;">
        <h4 style="font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--wf-text-muted); margin-bottom: 0.35rem;">Description</h4>
        <p style="color: #e5e7eb; font-size: 1rem; line-height: 1.6;" th:text="${card.description}">Description text</p>
    </div>

    <div th:if="${card.effects != null and !card.effects.isBlank()}" style="margin-bottom: 1.25rem; background: rgba(212, 175, 55, 0.05); border: 1px solid rgba(212, 175, 55, 0.25); border-radius: 0.375rem; padding: 0.85rem;">
        <h4 style="font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--wf-gold); margin-bottom: 0.35rem;">Manifestation Scaling</h4>
        <p style="color: #f3f4f6; font-size: 1rem; font-weight: 500; margin: 0;" th:text="${card.effects}">+15% / +25%</p>
    </div>
</div>
</body>
</html>
