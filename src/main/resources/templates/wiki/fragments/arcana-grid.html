<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="arcanaGrid" id="arcana-cards-grid">
    <div class="wiki-results-header">
        <div class="results-counter">
            Showing <span th:text="${#lists.size(cards)}">0</span> Arcana cards
        </div>
    </div>

    <div class="arcana-grid">
    <div th:if="${#lists.isEmpty(cards)}" class="empty-state texture-box" style="grid-column: 1 / -1; padding: 3rem; text-align: center;">
        <h3 style="color: var(--wf-gold); font-size: 1.25rem; margin-bottom: 0.5rem;">No Arcana Cards Found</h3>
        <p style="color: #9ca3af; font-size: 0.95rem;">Try adjusting your search query or elemental filter.</p>
    </div>

    <div th:each="card : ${cards}"
         class="arcana-card texture-box"
         th:id="${card.id}">
        <div class="arcana-card-header">
            <div class="arcana-icon-box">
                <img th:src="${card.iconUrl}" th:alt="${card.name}" loading="lazy" />
            </div>
            <div style="flex-grow: 1; min-width: 0;">
                <div style="display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; margin-bottom: 0.25rem;">
                    <h3 class="arcana-card-title" th:text="${card.name}">Card Name</h3>
                    <span th:if="${card.element != null}" class="element-pill">
                        <span class="element-dot" th:style="'background-color: ' + ${card.element.color}"></span>
                        <span th:style="'color: ' + ${card.element.color}" th:text="${card.element.name()}">Fire</span>
                    </span>
                </div>
                <div class="arcana-tags-row">
                    <span th:each="ptype : ${card.prophecyTypes}"
                          th:if="${card.element == null or (!ptype.equalsIgnoreCase(card.element.name()) and !ptype.equalsIgnoreCase(card.element.name() + ' Element'))}"
                          class="arcana-tag"
                          th:text="${ptype}">Type</span>
                    <span th:if="${card.element == null and (card.prophecyTypes == null or card.prophecyTypes.isEmpty())}"
                          class="arcana-tag" style="color: #9ca3af;">Neutral</span>
                </div>
            </div>
        </div>

        <div class="arcana-card-body">
            <p class="arcana-desc" th:text="${card.description}">Card description text</p>
            <div th:if="${card.effects != null and !card.effects.isBlank()}" class="arcana-effect-tier">
                <span class="tier-label">Effect:</span>
                <span class="tier-value" th:text="${card.effects}">+15% / +25%</span>
            </div>
        </div>
    </div>
    </div>
</div>
</body>
</html>
