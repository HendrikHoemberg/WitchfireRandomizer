<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item Wiki - Witchfire Companion</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/main.css">
    <script src="/js/htmx.min.js"></script>
    <script defer src="/js/alpine.min.js"></script>
</head>
<body>
    <div th:replace="~{fragments/navigation :: navbar('wiki')}"></div>

    <main class="container" x-data="{
        selectedCategory: '',
        selectedElement: '',
        noElement: false,
        searchQuery: '',
        sortCriteria: 'category',
        updateFilters() {
            htmx.ajax('GET', '/wiki/items', {
                target: '#wiki-items-grid',
                swap: 'outerHTML',
                values: {
                    category: this.selectedCategory,
                    element: this.selectedElement,
                    noElement: this.noElement,
                    search: this.searchQuery,
                    sort: this.sortCriteria
                }
            });
        },
        clearAllFilters() {
            this.selectedCategory = '';
            this.selectedElement = '';
            this.noElement = false;
            this.searchQuery = '';
            this.sortCriteria = 'category';
            this.updateFilters();
        }
    }">
        <!-- Centered Witchfire Logo -->
        <div class="logo-container">
            <a href="/">
                <img src="/images/wf-logo2.webp" alt="Witchfire" class="page-logo">
            </a>
        </div>

        <!-- Wiki Sub-Navigation Tabs -->
        <div th:replace="~{wiki/fragments/wiki-nav :: wikiNav('equipment')}"></div>

        <!-- Search and Filters Box -->
        <div class="wiki-filter-box texture-box">
            <div class="search-input-wrapper">
                <input type="text"
                       class="wiki-search-input"
                       placeholder="Search items..."
                       x-model="searchQuery"
                       @input.debounce.300ms="updateFilters()" />
                <button type="button"
                        x-show="searchQuery.length > 0"
                        @click="searchQuery = ''; updateFilters()"
                        class="search-clear-btn"
                        title="Clear search">
                    &times;
                </button>
            </div>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem;">
                <!-- Category Filter -->
                <div>
                    <h3 class="filter-section-title">Filter by Category</h3>
                    <div class="filter-pills-row">
                        <button type="button"
                                class="filter-pill-btn"
                                :class="selectedCategory === '' ? 'active' : ''"
                                @click="selectedCategory = ''; updateFilters()">
                            All Categories
                        </button>
                        <button th:each="cat : ${categories}"
                                type="button"
                                class="filter-pill-btn"
                                th:data-cat="${cat.name()}"
                                th:text="${cat.displayName}"
                                :class="selectedCategory === $el.dataset.cat ? 'active' : ''"
                                @click="selectedCategory = $el.dataset.cat; updateFilters()">
                            Category
                        </button>
                    </div>
                </div>

                <!-- Element Filter -->
                <div>
                    <h3 class="filter-section-title">Filter by Element</h3>
                    <div class="filter-pills-row">
                        <button type="button"
                                class="filter-pill-btn"
                                :class="(selectedElement === '' && !noElement) ? 'active' : ''"
                                @click="selectedElement = ''; noElement = false; updateFilters()">
                            All Elements
                        </button>
                        <button th:each="elem : ${elements}"
                                type="button"
                                class="filter-pill-btn"
                                th:data-elem="${elem.name()}"
                                th:text="${elem.name()}"
                                :class="(selectedElement === $el.dataset.elem && !noElement) ? 'active' : ''"
                                @click="selectedElement = $el.dataset.elem; noElement = false; updateFilters()">
                            Fire
                        </button>
                        <button type="button"
                                class="filter-pill-btn"
                                :class="noElement ? 'active' : ''"
                                @click="selectedElement = ''; noElement = true; updateFilters()">
                            No Element
                        </button>
                    </div>
                </div>
            </div>

            <!-- Reset Filters Button -->
            <div style="display: flex; justify-content: flex-end; margin-top: 1rem;"
                 x-show="selectedCategory || selectedElement || noElement || searchQuery">
                <button type="button"
                        class="filter-pill-btn filter-reset-btn"
                        @click="clearAllFilters()">
                    Reset Filters
                </button>
            </div>
        </div>

        <!-- Dynamic Results Header and Grid -->
        <div th:replace="~{wiki/fragments/item-grid :: itemGrid}"></div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
