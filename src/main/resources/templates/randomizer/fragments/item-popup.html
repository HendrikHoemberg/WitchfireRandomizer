<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="itemPopup(item)" class="item-card-popup-inner">
    <!-- Header: Icon, Name, Category, Element -->
    <div style="padding: 0.75rem 1rem; background-color: rgba(92, 91, 91, 0.75); display: flex; align-items: center; gap: 0.75rem;">
        <div style="width: 3rem; height: 3rem; background-color: #000; border-radius: 0.375rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <img th:if="${item.iconUrl != null}" th:src="${item.iconUrl}" th:alt="${item.name}" style="width: 100%; height: 100%; object-fit: contain;" />
            <span th:if="${item.iconUrl == null}" th:text="${#strings.substring(item.name, 0, 1)}" style="font-size: 1.5rem; color: #fff;">?</span>
        </div>
        <div style="flex-grow: 1; min-width: 0;">
            <div style="font-weight: 700; color: #fff; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" th:text="${item.name}">Name</div>
            <div style="display: flex; align-items: center; gap: 0.5rem; margin-top: 0.25rem;">
                <span style="font-size: 0.85rem; color: #d1d5db;" th:text="${item.category.displayName}">Category</span>
                <span th:if="${item.element != null}" class="element-pill" th:style="'color: ' + ${item.element.color}">
                    <span class="element-dot" th:style="'background-color: ' + ${item.element.color}"></span>
                    <span th:text="${item.element.name()}">Fire</span>
                </span>
            </div>
        </div>
    </div>

    <!-- Weapon Stats -->
    <div th:if="${item instanceof T(dev.hendrikhoemberg.witchfirerandomizer.model.Weapon)}" style="padding: 0.65rem 1rem; border-top: 1px solid #555; display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem; font-size: 0.85rem;">
        <div><span style="color: #9ca3af;">Damage:</span> <span style="color: #fff; font-weight: 600; margin-left: 0.25rem;" th:text="${item.damage}">0</span></div>
        <div><span style="color: #9ca3af;">Stun:</span> <span style="color: #fff; font-weight: 600; margin-left: 0.25rem;" th:text="${item.stunPower}">low</span></div>
        <div><span style="color: #9ca3af;">Hipfire:</span> <span style="color: #fff; font-weight: 600; margin-left: 0.25rem;" th:text="${item.hipfireRange + 'm'}">0m</span></div>
        <div><span style="color: #9ca3af;">ADS:</span> <span style="color: #fff; font-weight: 600; margin-left: 0.25rem;" th:text="${item.adsRange + 'm'}">0m</span></div>
        <div><span style="color: #9ca3af;">Stability:</span> <span style="color: #fff; font-weight: 600; margin-left: 0.25rem;" th:text="${item.stability != null ? item.stability : 'Medium'}">Medium</span></div>
        <div><span style="color: #9ca3af;">RoF:</span> <span style="color: #fff; font-weight: 600; margin-left: 0.25rem;" th:text="${item.rateOfFire}">0</span></div>
        <div><span style="color: #9ca3af;">Mobility:</span> <span style="color: #fff; font-weight: 600; margin-left: 0.25rem;" th:text="${item.mobility != null ? item.mobility : 'Medium'}">Medium</span></div>
        <div><span style="color: #9ca3af;">Clip:</span> <span style="color: #fff; font-weight: 600; margin-left: 0.25rem;" th:text="${item.magSize}">0</span></div>
    </div>

    <!-- Melee Weapon Stats -->
    <div th:if="${item instanceof T(dev.hendrikhoemberg.witchfirerandomizer.model.MeleeWeapon)}" style="padding: 0.65rem 1rem; border-top: 1px solid #555; display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem; font-size: 0.85rem;">
        <div><span style="color: #9ca3af;">Base:</span> <span style="color: #fff; font-weight: 600; margin-left: 0.25rem;" th:text="${item.baseDamage}">0</span></div>
        <div><span style="color: #9ca3af;">Charged:</span> <span style="color: #fff; font-weight: 600; margin-left: 0.25rem;" th:text="${item.chargedDamage}">0</span></div>
        <div th:if="${item.specialDamage != null and !item.specialDamage.isEmpty()}" style="grid-column: span 2;">
            <span style="color: #9ca3af;">Special:</span> <span style="color: #fff; font-weight: 600; margin-left: 0.25rem;" th:text="${item.specialDamage}">0</span>
        </div>
    </div>

    <!-- Rosary Bead Requirements -->
    <div th:if="${item instanceof T(dev.hendrikhoemberg.witchfirerandomizer.model.Bead) and !item.requirements.isEmpty()}" style="padding: 0.65rem 1rem; border-top: 1px solid #555;">
        <div style="font-size: 0.85rem; color: var(--wf-gold); font-weight: 700; margin-bottom: 0.35rem;">Requirements:</div>
        <div style="display: flex; flex-wrap: wrap; gap: 0.5rem;">
            <div th:each="req : ${item.requirements}" style="background-color: #2a2a2a; border: 1px solid #444; border-radius: 0.25rem; padding: 0.2rem 0.5rem; font-size: 0.8rem;">
                <span style="color: #d1d5db;" th:text="${req.stat} + ': '">Flesh: </span>
                <strong style="color: #fff;" th:text="${req.value}">10</strong>
            </div>
        </div>
    </div>

    <!-- Description -->
    <div th:if="${item.description != null and !item.description.isEmpty()}" class="item-popup-description" style="padding: 0.65rem 1rem; border-top: 1px solid #555; font-size: 0.875rem; color: #d1d5db; line-height: 1.45;">
        <p th:text="${item.description}">Description</p>
    </div>

    <!-- Mysterium Levels -->
    <div th:if="${!(item instanceof T(dev.hendrikhoemberg.witchfirerandomizer.model.Bead)) and !item.mysteriumTiers.isEmpty()}" style="padding: 0.65rem 1rem; border-top: 1px solid #555;">
        <div style="font-size: 0.85rem; color: #fff; font-weight: 700; margin-bottom: 0.4rem; text-align: center;">Mysterium Levels</div>
        <div th:each="tier : ${item.mysteriumTiers}" style="margin-bottom: 0.45rem; font-size: 0.82rem; line-height: 1.4;">
            <span style="color: var(--wf-gold); font-weight: 600;" th:text="'M' + ${tier.level} + ': '">M1: </span>
            <span style="color: #e5e7eb;" th:text="${tier.effect != null ? tier.effect : (tier.charismata != null and !tier.charismata.isEmpty() ? tier.charismata[0] : 'Effect')}">Effect</span>
        </div>
    </div>
</div>
</body>
</html>
