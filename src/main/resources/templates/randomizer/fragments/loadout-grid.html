<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div id="loadout-grid" th:fragment="loadoutGrid">
    <!-- 1. Current Loadout Card -->
    <div class="texture-box" style="padding: 1.5rem; margin-bottom: 2rem;">
        <!-- Card Header -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.75rem;">
            <h2 style="font-size: 1.25rem; font-weight: 600; color: #ffffff;">Current Loadout</h2>
            <div style="display: flex; gap: 0.5rem; align-items: center;">
                <button type="button"
                        class="btn-gray"
                        :class="shareCopied ? 'bg-green-600' : ''"
                        @click="generateShareLink()"
                        x-text="shareCopied ? 'Link copied to clipboard' : 'Generate Share Link'">
                    Generate Share Link
                </button>
                <button type="button"
                        class="btn-gray btn-danger"
                        @click="clearLoadoutSlots()">
                    Clear All
                </button>
            </div>
        </div>

        <!-- 9 Equipment Slots Container (Square Boxes) -->
        <div class="slots-container">
            <div th:replace="~{randomizer/fragments/slot-card :: slotCard('primaryWeapon', 'Primary Weapon', ${loadout.primaryWeapon}, ${request != null and request.locks != null and request.locks.get('primaryWeapon') == true})}"></div>
            <div th:replace="~{randomizer/fragments/slot-card :: slotCard('secondaryWeapon', 'Secondary Weapon', ${loadout.secondaryWeapon}, ${request != null and request.locks != null and request.locks.get('secondaryWeapon') == true})}"></div>
            <div th:replace="~{randomizer/fragments/slot-card :: slotCard('demonicWeapon', 'Demonic Weapon', ${loadout.demonicWeapon}, ${request != null and request.locks != null and request.locks.get('demonicWeapon') == true})}"></div>
            <div th:replace="~{randomizer/fragments/slot-card :: slotCard('meleeWeapon', 'Melee Weapon', ${loadout.meleeWeapon}, ${request != null and request.locks != null and request.locks.get('meleeWeapon') == true})}"></div>
            <div th:replace="~{randomizer/fragments/slot-card :: slotCard('relic', 'Relic', ${loadout.relic}, ${request != null and request.locks != null and request.locks.get('relic') == true})}"></div>
            <div th:replace="~{randomizer/fragments/slot-card :: slotCard('fetish', 'Fetish', ${loadout.fetish}, ${request != null and request.locks != null and request.locks.get('fetish') == true})}"></div>
            <div th:replace="~{randomizer/fragments/slot-card :: slotCard('ring', 'Ring', ${loadout.ring}, ${request != null and request.locks != null and request.locks.get('ring') == true})}"></div>
            <div th:replace="~{randomizer/fragments/slot-card :: slotCard('lightSpell', 'Light Spell', ${loadout.lightSpell}, ${request != null and request.locks != null and request.locks.get('lightSpell') == true})}"></div>
            <div th:replace="~{randomizer/fragments/slot-card :: slotCard('heavySpell', 'Heavy Spell', ${loadout.heavySpell}, ${request != null and request.locks != null and request.locks.get('heavySpell') == true})}"></div>
        </div>

        <!-- Active Elements Row -->
        <div class="active-elements-row">
            <div th:each="elem : ${T(dev.hendrikhoemberg.witchfirerandomizer.model.Element).values()}"
                 class="active-element-pill"
                 th:classappend="${activeElements != null and activeElements.contains(elem) ? 'active' : 'inactive'}">
                <div class="dot-indicator" th:style="'background-color: ' + ${elem.color}"></div>
                <span th:text="${elem.name()}">Fire</span>
            </div>
        </div>

        <!-- Helper Notice -->
        <div style="margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid #555555; text-align: center;">
            <p style="font-size: 0.8rem; color: #9ca3af;">Click on a Slot to lock/unlock it.</p>
        </div>
    </div>

    <!-- 2. Prominent Center Generate Button -->
    <div style="display: flex; justify-content: center; margin-bottom: 2rem;">
        <button type="submit"
                class="btn-generate"
                :disabled="isGenerating || isFadingOut"
                @click.prevent="generateLoadout()"
                title="Generate New Loadout"
                x-text="isGenerating || isFadingOut ? 'Generating...' : 'Generate New Loadout'">
            Generate New Loadout
        </button>
    </div>

    <!-- 3. Beads Card -->
    <div class="texture-box" style="padding: 1.5rem; margin-bottom: 2rem;">
        <!-- Card Header -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.75rem;">
            <h2 style="font-size: 1.25rem; font-weight: 600; color: #ffffff;">Beads</h2>
            <div style="display: flex; gap: 0.5rem; align-items: center;">
                <button type="button"
                        class="btn-gray"
                        @click="showBeadSettings = true">
                    Settings
                </button>
                <button type="button"
                        class="btn-gray btn-danger"
                        @click="clearBeadSlots()">
                    Clear All
                </button>
            </div>
        </div>

        <!-- Bead Slots Container -->
        <div class="slots-container">
            <th:block th:each="i : ${#numbers.sequence(1, 5)}">
                <div th:if="${i <= 5}"
                     th:attr="x-show='beadSlotCount >= ' + ${i}"
                     style="display: contents;">
                    <div th:replace="~{randomizer/fragments/bead-slots :: beadSlot('bead' + ${i}, 'Bead ' + ${i}, ${loadout.beads != null and loadout.beads.size() >= i ? loadout.beads.get(i - 1) : null}, ${i}, ${request != null and request.locks != null and request.locks.get('bead' + i) == true})}"></div>
                </div>
            </th:block>
        </div>

        <!-- Stat Requirements for Current Beads Table -->
        <div class="bead-requirements-box">
            <h3 style="font-size: 0.95rem; font-weight: 600; color: #ffffff; margin-bottom: 0.75rem; text-align: left;">
                Stat Requirements for Current Beads
            </h3>
            <div class="requirements-grid">
                <div th:each="entry : ${statRequirements}" class="requirement-item" th:data-stat="${entry.key}" th:data-required="${entry.value}">
                    <span style="color: #d1d5db; font-size: 0.85rem; font-weight: 500;" th:text="${entry.key} + ':'">Flesh:</span>
                    <div style="display: flex; align-items: center; gap: 0.35rem;">
                        <span style="font-size: 0.85rem; font-weight: 700;"
                              th:classappend="${entry.value == 0 ? 'text-gray-500' : 'text-white'}"
                              th:text="${entry.value == 0 ? 'N/A' : entry.value}">
                            N/A
                        </span>
                        <span th:if="${entry.value > 0}"
                              style="font-size: 0.75rem; padding: 0.1rem 0.35rem; border-radius: 0.25rem; font-weight: 700;"
                              :class="userStats[$el.closest('.requirement-item').dataset.stat] >= Number($el.closest('.requirement-item').dataset.required) ? 'bg-green-900 text-green-200' : 'bg-red-900 text-red-200'"
                              x-text="userStats[$el.closest('.requirement-item').dataset.stat] >= Number($el.closest('.requirement-item').dataset.required) ? '✓' : '✗'">
                            ✓
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
