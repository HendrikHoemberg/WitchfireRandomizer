<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div id="loadout-grid" th:fragment="loadoutGrid">
    <!-- Main 9 Equipment Slots -->
    <div class="loadout-grid">
        <div th:replace="~{randomizer/fragments/slot-card :: slotCard('primaryWeapon', 'Primary Weapon', ${loadout.primaryWeapon})}"></div>
        <div th:replace="~{randomizer/fragments/slot-card :: slotCard('secondaryWeapon', 'Secondary Weapon', ${loadout.secondaryWeapon})}"></div>
        <div th:replace="~{randomizer/fragments/slot-card :: slotCard('demonicWeapon', 'Demonic Weapon', ${loadout.demonicWeapon})}"></div>
        <div th:replace="~{randomizer/fragments/slot-card :: slotCard('meleeWeapon', 'Melee Weapon', ${loadout.meleeWeapon})}"></div>
        <div th:replace="~{randomizer/fragments/slot-card :: slotCard('lightSpell', 'Light Spell', ${loadout.lightSpell})}"></div>
        <div th:replace="~{randomizer/fragments/slot-card :: slotCard('heavySpell', 'Heavy Spell', ${loadout.heavySpell})}"></div>
        <div th:replace="~{randomizer/fragments/slot-card :: slotCard('relic', 'Relic', ${loadout.relic})}"></div>
        <div th:replace="~{randomizer/fragments/slot-card :: slotCard('fetish', 'Fetish', ${loadout.fetish})}"></div>
        <div th:replace="~{randomizer/fragments/slot-card :: slotCard('ring', 'Ring', ${loadout.ring})}"></div>
    </div>

    <!-- Equipped Beads Section -->
    <div class="beads-section texture-bg">
        <div class="beads-header">
            <h3 style="color: var(--wf-gold-bright); font-size: 1.15rem; text-transform: uppercase; letter-spacing: 0.05em;">
                Equipped Rosary Beads
            </h3>
            <button type="button" class="btn btn-secondary btn-sm" @click="showBeadModal = true">
                ⚙ Bead Settings
            </button>
        </div>
        <div class="beads-grid">
            <div th:each="bead : ${loadout.beads}" class="bead-card">
                <img th:if="${bead.iconUrl != null}" th:src="${bead.iconUrl}" th:alt="${bead.name}" class="bead-icon" />
                <div class="bead-info">
                    <div class="bead-name" th:text="${bead.name}">Bead Name</div>
                    <div class="bead-desc" th:text="${bead.description}">Description</div>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(loadout.beads)}" style="grid-column: 1 / -1; color: var(--wf-text-muted); font-size: 0.85rem;">
                No beads equipped matching stat requirements.
            </div>
        </div>
    </div>
</div>
</body>
</html>
