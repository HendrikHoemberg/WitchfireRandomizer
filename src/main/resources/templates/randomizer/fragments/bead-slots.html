<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="beadSlot(slotKey, slotLabel, bead, index, isLocked)"
     class="slot-box"
     th:classappend="${(bead == null ? 'empty ' : '') + (isLocked == true ? 'locked ' : '')}"
     th:id="'slot-' + ${slotKey}"
     :class="{ 'locked': beadLocks[$el.dataset.slotKey], 'animate-glow-pulse shadow-glow': isSlotGenerating($el.dataset.slotKey, 'bead'), 'card-revealing': isSlotGenerating($el.dataset.slotKey, 'bead') && isFadingOut }"
     @click="toggleBeadLock($el.dataset.slotKey)"
     @mouseenter="showPopup($el)"
     @mouseleave="hidePopup()">

    <input type="hidden" th:name="'currentSlotItemIds[' + ${slotKey} + ']'" th:value="${bead != null ? bead.id : ''}" />
    <input type="hidden" th:name="'locks[' + ${slotKey} + ']'" :value="beadLocks[$el.closest('.slot-box').dataset.slotKey] ? 'true' : 'false'" value="false" />

    <!-- White fill overlay for generation animation -->
    <div class="slot-white-overlay"
         :class="{ 'white-fill-in': isSlotGenerating($el.closest('.slot-box').dataset.slotKey, 'bead') && !isFadingOut, 'white-fill-out': isSlotGenerating($el.closest('.slot-box').dataset.slotKey, 'bead') && isFadingOut }"
         x-show="isSlotGenerating($el.closest('.slot-box').dataset.slotKey, 'bead')">
    </div>

    <!-- Populated Bead State -->
    <th:block th:if="${bead != null}">
        <button type="button"
                class="slot-info-btn"
                th:data-item-id="${bead.id}"
                @click.stop="openItemModal($el.dataset.itemId)"
                title="View bead details">
            i
        </button>

        <div class="slot-icon-area">
            <div class="slot-icon-square">
                <img th:if="${bead.iconUrl != null}"
                     th:src="${bead.iconUrl}"
                     th:alt="${bead.name}"
                     class="slot-icon-img" />
                <span th:if="${bead.iconUrl == null}"
                      th:text="${#strings.substring(bead.name, 0, 1)}"
                      style="font-size: 1.5rem; color: #fff;">?</span>
            </div>
        </div>

        <div class="slot-name-label"
             th:text="${bead.name}">
            Bead Name
        </div>

        <!-- Bead Popup Template -->
        <template class="popup-template">
            <div th:replace="~{randomizer/fragments/item-popup :: itemPopup(${bead})}"></div>
        </template>
    </th:block>

    <!-- Empty Bead State -->
    <th:block th:if="${bead == null}">
        <div class="slot-icon-area">
            <div style="width: 80px; height: 80px; background-color: rgba(134, 134, 134, 0.3); border-radius: 0.375rem; display: flex; align-items: center; justify-content: center;">
                <span style="font-size: 2rem; color: #ffffff; line-height: 1;">+</span>
            </div>
        </div>
        <div class="slot-name-label"
             th:text="${slotLabel}">
            Bead Slot
        </div>
    </th:block>
</div>
</body>
</html>
