<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="beadSlot(slotKey, slotLabel, bead, index)"
     class="slot-box"
     th:classappend="${bead == null ? 'empty' : ''}"
     th:id="'slot-' + ${slotKey}"
     :class="{ 'locked': beadLocks['__${slotKey}__'] }"
     @click="toggleBeadLock('__${slotKey}__')"
     @mouseenter="hoveredSlot = '__${slotKey}__'"
     @mouseleave="if (hoveredSlot === '__${slotKey}__') hoveredSlot = null">

    <input type="hidden" th:name="'currentSlotItemIds[' + ${slotKey} + ']'" th:value="${bead != null ? bead.id : ''}" />
    <input type="hidden" th:name="'locks[' + ${slotKey} + ']'" :value="beadLocks['__${slotKey}__'] ? 'true' : 'false'" />

    <!-- Populated Bead State -->
    <th:block th:if="${bead != null}">
        <button type="button"
                class="slot-info-btn"
                th:data-item-id="${bead.id}"
                @click.stop="openItemModal($el.dataset.itemId)"
                title="View bead details">
            i
        </button>

        <div class="slot-icon-area">
            <div class="slot-icon-square">
                <img th:if="${bead.iconUrl != null}"
                     th:src="${bead.iconUrl}"
                     th:alt="${bead.name}"
                     class="slot-icon-img" />
                <span th:if="${bead.iconUrl == null}"
                      th:text="${#strings.substring(bead.name, 0, 1)}"
                      style="font-size: 1.5rem; color: #fff;">?</span>
            </div>
        </div>

        <div class="slot-name-label"
             :class="{ 'locked-text': beadLocks['__${slotKey}__'] }"
             th:text="${bead.name}">
            Bead Name
        </div>

        <!-- Desktop Hover Popup -->
        <div class="item-card-popup"
             x-show="hoveredSlot === '__${slotKey}__'"
             x-cloak
             style="display: none; top: 0; left: 140px; text-align: left;"
             @click.stop>
            <div style="padding: 0.5rem 0.75rem; background-color: rgba(92, 91, 91, 0.72); display: flex; align-items: center; gap: 0.5rem;">
                <div style="width: 2.5rem; height: 2.5rem; background-color: #000; border-radius: 0.25rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                    <img th:if="${bead.iconUrl != null}" th:src="${bead.iconUrl}" th:alt="${bead.name}" style="width: 100%; height: 100%; object-fit: contain;" />
                </div>
                <div>
                    <div style="font-weight: 700; color: #fff; font-size: 0.9rem;" th:text="${bead.name}">Name</div>
                    <div style="font-size: 0.75rem; color: #9ca3af;">Rosary Bead</div>
                </div>
            </div>
            <div style="padding: 0.5rem 0.75rem; border-top: 1px solid #555; font-size: 0.8rem; color: #d1d5db;">
                <p th:text="${bead.description}">Description</p>
            </div>
            <div th:if="${!bead.requirements.isEmpty()}" style="padding: 0.5rem 0.75rem; border-top: 1px solid #555;">
                <div style="font-size: 0.75rem; color: var(--wf-gold); font-weight: 700; margin-bottom: 0.25rem;">Requirements:</div>
                <div th:each="req : ${bead.requirements}" style="font-size: 0.75rem; color: #d1d5db;">
                    <span th:text="${req.stat} + ': '">Flesh: </span>
                    <strong style="color: #fff;" th:text="${req.value}">10</strong>
                </div>
            </div>
        </div>
    </th:block>

    <!-- Empty Bead State -->
    <th:block th:if="${bead == null}">
        <div class="slot-icon-area">
            <div style="width: 80px; height: 80px; background-color: rgba(134, 134, 134, 0.3); border-radius: 0.375rem; display: flex; align-items: center; justify-content: center;">
                <span style="font-size: 2rem; color: #ffffff; line-height: 1;">+</span>
            </div>
        </div>
        <div class="slot-name-label"
             :class="{ 'locked-text': beadLocks['__${slotKey}__'] }"
             th:text="${slotLabel}">
            Bead Slot
        </div>
    </th:block>
</div>
</body>
</html>
