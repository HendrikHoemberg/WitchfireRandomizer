<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="slotCard(slotKey, slotLabel, item, isLocked)"
     class="slot-box"
     th:classappend="${(item == null ? 'empty ' : '') + (isLocked == true ? 'locked ' : '')}"
     th:id="'slot-' + ${slotKey}"
     th:data-slot-key="${slotKey}"
     :class="{ 'locked': locks[$el.dataset.slotKey] }"
     @click="toggleLock($el.dataset.slotKey)"
     @mouseenter="hoveredSlot = $el.dataset.slotKey"
     @mouseleave="if (hoveredSlot === $el.dataset.slotKey) hoveredSlot = null">

    <!-- Hidden state inputs for form serialization -->
    <input type="hidden" th:name="'currentSlotItemIds[' + ${slotKey} + ']'" th:value="${item != null ? item.id : ''}" />
    <input type="hidden" th:name="'locks[' + ${slotKey} + ']'" :value="locks[$el.closest('.slot-box').dataset.slotKey] ? 'true' : 'false'" value="false" />

    <!-- Populated Item State -->
    <th:block th:if="${item != null}">
        <!-- Top-Left Info Button -->
        <button type="button"
                class="slot-info-btn"
                th:data-item-id="${item.id}"
                @click.stop="openItemModal($el.dataset.itemId)"
                title="View item details">
            i
        </button>

        <!-- Top-Right Element Dot -->
        <div th:if="${item.element != null}"
             class="slot-element-dot"
             th:style="'background-color: ' + ${item.element.color}"
             th:title="${item.element.name()}">
        </div>

        <!-- Center Icon Box -->
        <div class="slot-icon-area">
            <div class="slot-icon-square">
                <img th:if="${item.iconUrl != null}"
                     th:src="${item.iconUrl}"
                     th:alt="${item.name}"
                     class="slot-icon-img" />
                <span th:if="${item.iconUrl == null}"
                      th:text="${#strings.substring(item.name, 0, 1)}"
                      style="font-size: 1.5rem; color: #fff;">?</span>
            </div>
        </div>

        <!-- Bottom Name Label -->
        <div class="slot-name-label"
             th:text="${item.name}">
            Item Name
        </div>

        <!-- Desktop Hover Popup -->
        <div class="item-card-popup"
             x-show="hoveredSlot === $el.closest('.slot-box').dataset.slotKey"
             x-cloak
             style="top: 0; left: 140px; text-align: left;"
             @click.stop>
            <div style="padding: 0.5rem 0.75rem; background-color: rgba(92, 91, 91, 0.72); display: flex; align-items: center; gap: 0.5rem;">
                <div style="width: 2.5rem; height: 2.5rem; background-color: #000; border-radius: 0.25rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                    <img th:if="${item.iconUrl != null}" th:src="${item.iconUrl}" th:alt="${item.name}" style="width: 100%; height: 100%; object-fit: contain;" />
                </div>
                <div>
                    <div style="font-weight: 700; color: #fff; font-size: 0.9rem;" th:text="${item.name}">Name</div>
                    <div style="font-size: 0.75rem; color: #9ca3af;" th:text="${item.category.displayName}">Category</div>
                </div>
            </div>
            <!-- Stats -->
            <div th:if="${item instanceof T(dev.hendrikhoemberg.witchfirerandomizer.model.Weapon)}" style="padding: 0.5rem 0.75rem; border-top: 1px solid #555; display: grid; grid-template-columns: 1fr 1fr; gap: 0.25rem; font-size: 0.75rem;">
                <div><span style="color: #9ca3af;">Damage:</span> <span style="color: #fff;" th:text="${item.damage}">0</span></div>
                <div><span style="color: #9ca3af;">Stun:</span> <span style="color: #fff;" th:text="${item.stunPower}">low</span></div>
                <div><span style="color: #9ca3af;">Hipfire:</span> <span style="color: #fff;" th:text="${item.hipfireRange + 'm'}">0m</span></div>
                <div><span style="color: #9ca3af;">ADS:</span> <span style="color: #fff;" th:text="${item.adsRange + 'm'}">0m</span></div>
                <div><span style="color: #9ca3af;">RoF:</span> <span style="color: #fff;" th:text="${item.rateOfFire}">0</span></div>
                <div><span style="color: #9ca3af;">Clip:</span> <span style="color: #fff;" th:text="${item.magSize}">0</span></div>
            </div>
            <div th:if="${item instanceof T(dev.hendrikhoemberg.witchfirerandomizer.model.MeleeWeapon)}" style="padding: 0.5rem 0.75rem; border-top: 1px solid #555; display: grid; grid-template-columns: 1fr 1fr; gap: 0.25rem; font-size: 0.75rem;">
                <div><span style="color: #9ca3af;">Base:</span> <span style="color: #fff;" th:text="${item.baseDamage}">0</span></div>
                <div><span style="color: #9ca3af;">Charged:</span> <span style="color: #fff;" th:text="${item.chargedDamage}">0</span></div>
            </div>
            <!-- Mysterium summary -->
            <div th:if="${!item.mysteriumTiers.isEmpty()}" style="padding: 0.5rem 0.75rem; border-top: 1px solid #555;">
                <div style="font-size: 0.75rem; color: #fff; font-weight: 700; margin-bottom: 0.25rem; text-align: center;">Mysterium Levels</div>
                <div th:each="tier : ${item.mysteriumTiers}" style="margin-bottom: 0.25rem; font-size: 0.7rem;">
                    <span style="color: var(--wf-gold); font-weight: 600;" th:text="'M' + ${tier.level} + ': '">M1: </span>
                    <span style="color: #d1d5db;" th:text="${tier.effect != null ? tier.effect : (tier.charismata != null and !tier.charismata.isEmpty() ? tier.charismata[0] : 'Effect')}">Effect</span>
                </div>
            </div>
        </div>
    </th:block>

    <!-- Empty Item State -->
    <th:block th:if="${item == null}">
        <div class="slot-icon-area">
            <div style="width: 80px; height: 80px; background-color: rgba(134, 134, 134, 0.3); border-radius: 0.375rem; display: flex; align-items: center; justify-content: center;">
                <span style="font-size: 2rem; color: #ffffff; line-height: 1;">+</span>
            </div>
        </div>
        <div class="slot-name-label"
             th:text="${slotLabel}">
            Slot Name
        </div>
    </th:block>
</div>

<th:block th:fragment="slotCardFragment">
    <div th:replace="~{randomizer/fragments/slot-card :: slotCard(${slotKey}, ${slotLabel}, ${item}, ${request != null and request.locks != null and request.locks.get(slotKey) == true})}"></div>
</th:block>
</body>
</html>
