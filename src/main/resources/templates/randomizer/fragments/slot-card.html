<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="slotCard(slotKey, slotLabel, item)"
     class="slot-card texture-bg animate-flash"
     th:id="'slot-' + ${slotKey}"
     :class="{ 'slot-locked': locks['__${slotKey}__'] }">

    <!-- Hidden state inputs for form serialization -->
    <input type="hidden" th:name="'currentSlotItemIds[' + ${slotKey} + ']'" th:value="${item != null ? item.id : ''}" />
    <input type="hidden" th:name="'locks[' + ${slotKey} + ']'" :value="locks['__${slotKey}__'] ? 'true' : 'false'" />

    <!-- Slot Header -->
    <div class="slot-header">
        <span th:text="${slotLabel}">Slot Label</span>
        <div class="slot-actions">
            <button type="button"
                    class="slot-reroll-btn"
                    th:hx-post="@{/randomizer/reroll-slot(slotKey=${slotKey}, slotLabel=${slotLabel})}"
                    th:hx-target="'#slot-' + ${slotKey}"
                    hx-swap="outerHTML"
                    hx-include="#randomizer-form"
                    title="Reroll this slot">
                ↻ Reroll
            </button>
            <button type="button"
                    class="lock-btn"
                    @click="locks['__${slotKey}__'] = !locks['__${slotKey}__']"
                    title="Lock/Unlock this slot">
                <img :src="locks['__${slotKey}__'] ? '/images/lockClosed.png' : '/images/lockOpen.png'"
                     alt="Lock"
                     class="lock-icon" />
            </button>
        </div>
    </div>

    <!-- Slot Content -->
    <div class="slot-body">
        <div class="slot-icon-box">
            <img th:if="${item != null and item.iconUrl != null}"
                 th:src="${item.iconUrl}"
                 th:alt="${item.name}"
                 class="slot-icon-img" />
        </div>
        <div class="slot-info">
            <h4 class="slot-item-name" th:text="${item != null ? item.name : 'Empty'}">Item Name</h4>
            <div class="slot-item-meta">
                <span th:if="${item != null and item.element != null}" class="element-pill">
                    <span class="element-dot" th:style="'background-color: ' + ${item.element.color}"></span>
                    <span th:text="${item.element.name()}" th:style="'color: ' + ${item.element.color}">Element</span>
                </span>
                <span th:if="${item instanceof T(dev.hendrikhoemberg.witchfirerandomizer.model.Weapon)}"
                      th:text="${item.weaponFamily}">Type</span>
                <span th:if="${item instanceof T(dev.hendrikhoemberg.witchfirerandomizer.model.Spell)}"
                      th:text="${item.charges + ' charges'}">1 charge</span>
            </div>
        </div>
    </div>

    <!-- Stats Preview -->
    <div th:if="${item instanceof T(dev.hendrikhoemberg.witchfirerandomizer.model.Weapon)}" class="slot-stats-preview">
        <span>Dmg: <strong th:text="${item.damage}">0</strong></span>
        <span>Crit: <strong th:text="${item.criticalDamage}">0</strong></span>
        <span>Range: <strong th:text="${item.adsRange + 'm'}">0m</strong></span>
        <span>Mag: <strong th:text="${item.magSize}">0</strong></span>
    </div>
    <div th:if="${item instanceof T(dev.hendrikhoemberg.witchfirerandomizer.model.MeleeWeapon)}" class="slot-stats-preview">
        <span>Base Dmg: <strong th:text="${item.baseDamage}">0</strong></span>
        <span>Charged: <strong th:text="${item.chargedDamage}">0</strong></span>
        <span th:if="${item.specialDamage != null}">Special: <strong th:text="${item.specialDamage}">0</strong></span>
    </div>
    <div th:if="${item instanceof T(dev.hendrikhoemberg.witchfirerandomizer.model.Spell)}" class="slot-stats-preview">
        <span>Recharge: <strong th:text="${item.recharge + 's'}">0s</strong></span>
    </div>
    <div th:if="${item instanceof T(dev.hendrikhoemberg.witchfirerandomizer.model.MagicalItem)}" class="slot-stats-preview">
        <span th:text="${item.description}">Item effect</span>
    </div>
</div>

<th:block th:fragment="slotCardFragment">
    <div th:replace="~{randomizer/fragments/slot-card :: slotCard(${slotKey}, ${slotLabel}, ${item})}"></div>
</th:block>
</body>
</html>
