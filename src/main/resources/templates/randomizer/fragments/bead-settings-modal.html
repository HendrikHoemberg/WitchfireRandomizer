<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="beadModal" x-show="showBeadModal" class="modal-overlay" x-cloak>
    <div class="modal-dialog texture-bg" @click.away="showBeadModal = false" style="padding: 2rem;">
        <button type="button" class="modal-close-btn" @click="showBeadModal = false">&times;</button>
        <h2 style="color: var(--wf-gold-bright); font-size: 1.5rem; margin-bottom: 0.5rem; text-transform: uppercase;">
            Bead Stat Constraints
        </h2>
        <p style="color: var(--wf-text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">
            Configure your character's stats to filter bead eligibility.
        </p>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-bottom: 1.5rem;">
            <div>
                <label style="font-size: 0.85rem; color: var(--wf-gold);">Flesh: <strong x-text="beadStats.Flesh">100</strong></label>
                <input type="range" min="0" max="100" class="search-input" style="width: 100%; padding: 0;"
                       x-model.number="beadStats.Flesh" name="beadUserStats[Flesh]" />
            </div>
            <div>
                <label style="font-size: 0.85rem; color: var(--wf-gold);">Blood: <strong x-text="beadStats.Blood">100</strong></label>
                <input type="range" min="0" max="100" class="search-input" style="width: 100%; padding: 0;"
                       x-model.number="beadStats.Blood" name="beadUserStats[Blood]" />
            </div>
            <div>
                <label style="font-size: 0.85rem; color: var(--wf-gold);">Mind: <strong x-text="beadStats.Mind">100</strong></label>
                <input type="range" min="0" max="100" class="search-input" style="width: 100%; padding: 0;"
                       x-model.number="beadStats.Mind" name="beadUserStats[Mind]" />
            </div>
            <div>
                <label style="font-size: 0.85rem; color: var(--wf-gold);">Witchery: <strong x-text="beadStats.Witchery">100</strong></label>
                <input type="range" min="0" max="100" class="search-input" style="width: 100%; padding: 0;"
                       x-model.number="beadStats.Witchery" name="beadUserStats[Witchery]" />
            </div>
            <div>
                <label style="font-size: 0.85rem; color: var(--wf-gold);">Arsenal: <strong x-text="beadStats.Arsenal">100</strong></label>
                <input type="range" min="0" max="100" class="search-input" style="width: 100%; padding: 0;"
                       x-model.number="beadStats.Arsenal" name="beadUserStats[Arsenal]" />
            </div>
            <div>
                <label style="font-size: 0.85rem; color: var(--wf-gold);">Faith: <strong x-text="beadStats.Faith">100</strong></label>
                <input type="range" min="0" max="100" class="search-input" style="width: 100%; padding: 0;"
                       x-model.number="beadStats.Faith" name="beadUserStats[Faith]" />
            </div>
        </div>

        <div style="margin-bottom: 2rem;">
            <label style="font-size: 0.85rem; color: var(--wf-gold); display: block; margin-bottom: 0.5rem;">
                Bead Slots Count: <strong x-text="beadSlotCount">5</strong>
            </label>
            <input type="range" min="1" max="5" class="search-input" style="width: 100%; padding: 0;"
                   x-model.number="beadSlotCount" name="beadSlotCount" />
        </div>

        <div style="display: flex; justify-content: flex-end;">
            <button type="button" class="btn btn-primary" @click="showBeadModal = false">
                Apply & Close
            </button>
        </div>
    </div>
</div>
</body>
</html>
