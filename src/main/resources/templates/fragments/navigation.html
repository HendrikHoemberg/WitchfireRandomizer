<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="navbar(activeTab)" x-data="{ isSidebarOpen: false }" @keydown.escape.window="isSidebarOpen = false">
    <!-- Fixed Top Bar with Burger Button -->
    <nav class="navbar-fixed"
         :class="isSidebarOpen ? 'sidebar-open' : ''">
        <div class="navbar-container">
            <button type="button"
                    class="burger-btn"
                    @click.stop="isSidebarOpen = !isSidebarOpen"
                    aria-label="Toggle navigation menu">
                <span class="burger-bar" :class="isSidebarOpen ? 'bar-top-open' : ''"></span>
                <span class="burger-bar" :class="isSidebarOpen ? 'bar-mid-open' : ''"></span>
                <span class="burger-bar" :class="isSidebarOpen ? 'bar-bot-open' : ''"></span>
            </button>
        </div>
    </nav>

    <!-- Slide-in Sidebar Drawer -->
    <div class="sidebar-drawer"
         :class="isSidebarOpen ? 'translate-x-0' : ''"
         @click.away="isSidebarOpen = false">
        <div style="padding-top: 5rem; padding-bottom: 2rem; padding-left: 1.5rem; padding-right: 1.5rem;">
            <ul style="list-style: none; display: flex; flex-direction: column; gap: 0.75rem;">
                <li>
                    <a href="/"
                       class="sidebar-link"
                       th:classappend="${activeTab == 'randomizer' ? 'active' : ''}">
                        Loadout Randomizer
                    </a>
                </li>
                <li>
                    <a href="/wiki"
                       class="sidebar-link"
                       th:classappend="${activeTab == 'wiki' ? 'active' : ''}">
                        Item Wiki
                    </a>
                </li>
            </ul>
        </div>
    </div>

    <!-- Backdrop Overlay -->
    <div class="sidebar-backdrop"
         x-show="isSidebarOpen"
         @click="isSidebarOpen = false"
         x-cloak></div>
</div>
</body>
</html>
