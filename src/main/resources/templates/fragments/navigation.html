<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="navbar(activeTab)" x-data="{ isSidebarOpen: false }" @keydown.escape.window="isSidebarOpen = false">
    <!-- Fixed Top Bar with Burger Button -->
    <nav class="fixed top-0 left-0 right-0 z-50 py-4 px-6 transition-colors duration-150"
         :class="isSidebarOpen ? 'bg-[#1a1a1a]' : 'bg-[#1a1a1abb]'"
         style="backdrop-filter: blur(8px); border-bottom: 1px solid rgba(129, 129, 129, 0.2);">
        <div style="max-width: 1400px; margin: 0 auto; display: flex; align-items: center;">
            <button type="button"
                    class="burger-btn"
                    @click="isSidebarOpen = !isSidebarOpen"
                    aria-label="Toggle navigation menu">
                <span class="burger-bar" :class="isSidebarOpen ? 'rotate-45 translate-y-2' : ''"></span>
                <span class="burger-bar" :class="isSidebarOpen ? 'opacity-0' : 'opacity-100'"></span>
                <span class="burger-bar" :class="isSidebarOpen ? '-rotate-45 -translate-y-2' : ''"></span>
            </button>
        </div>
    </nav>

    <!-- Slide-in Sidebar Drawer -->
    <div class="sidebar-drawer"
         :class="isSidebarOpen ? 'translate-x-0' : '-translate-x-full'"
         @click.away="isSidebarOpen = false">
        <div style="padding-top: 5rem; padding-bottom: 2rem; padding-left: 1.5rem; padding-right: 1.5rem;">
            <ul style="list-style: none; display: flex; flex-direction: column; gap: 0.75rem;">
                <li>
                    <a href="/"
                       class="sidebar-link"
                       th:classappend="${activeTab == 'randomizer' ? 'active' : ''}">
                        Loadout Randomizer
                    </a>
                </li>
                <li>
                    <a href="/wiki"
                       class="sidebar-link"
                       th:classappend="${activeTab == 'wiki' ? 'active' : ''}">
                        Item Wiki
                    </a>
                </li>
            </ul>
        </div>
    </div>

    <!-- Backdrop Overlay -->
    <div class="sidebar-backdrop"
         x-show="isSidebarOpen"
         @click="isSidebarOpen = false"
         style="display: none;"
         x-cloak></div>
</div>
</body>
</html>
