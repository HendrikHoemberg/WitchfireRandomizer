<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found - Witchfire Companion</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <div th:replace="~{fragments/navigation :: navbar(null)}"></div>

    <main class="container" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; text-align: center;">
        <div style="background: var(--wf-box-bg); border: 1px solid var(--wf-border); border-radius: 8px; padding: 2.5rem; max-width: 500px; width: 100%;">
            <h1 style="color: var(--wf-gold); font-size: 3rem; margin-bottom: 0.5rem;">404</h1>
            <h2 style="font-size: 1.4rem; margin-bottom: 1rem; color: var(--wf-text);">Page or Item Not Found</h2>
            <p style="color: var(--wf-text-muted); margin-bottom: 2rem;">The requested item or page could not be located in the archives.</p>
            <div style="display: flex; gap: 1rem; justify-content: center;">
                <a href="/randomizer" class="primary-btn" style="text-decoration: none; padding: 0.6rem 1.2rem; border-radius: 4px; display: inline-block;">Loadout Randomizer</a>
                <a href="/wiki" class="secondary-btn" style="text-decoration: none; padding: 0.6rem 1.2rem; border-radius: 4px; display: inline-block;">Item Wiki</a>
            </div>
        </div>
    </main>
</body>
</html>
